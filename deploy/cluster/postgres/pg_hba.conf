# Local socket access is needed by the official image initialization scripts.
local   all             all                                     trust
# Replication and application traffic must use TLS and SCRAM.
hostssl replication     replicator      0.0.0.0/0               scram-sha-256
hostssl replication     replicator      ::/0                    scram-sha-256
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::/0                    scram-sha-256
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
