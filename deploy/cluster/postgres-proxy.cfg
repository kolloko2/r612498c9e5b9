global
  log stdout format raw local0
  maxconn 256
  user haproxy
  group haproxy
  stats socket /var/lib/haproxy/admin.sock mode 660 level admin
  server-state-file /var/lib/haproxy/server-state

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 3s
  timeout client 60s
  timeout server 60s
  load-server-state-from-file global

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s
  hold obsolete 5s

frontend postgres_writer
  bind :5432
  default_backend postgres_nodes

backend postgres_nodes
  option tcp-check
  server primary pg-primary:5432 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
  # Promotion is operator-driven. This server starts disabled and is never
  # selected merely because the primary becomes unreachable.
  server standby pg-standby:5432 check inter 2s fall 2 rise 2 disabled resolvers docker init-addr libc,none
