# Local socket access is required by the official image's initialization path.
local   all             all                                     trust
# All TCP database access must negotiate TLS and authenticate with SCRAM.
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::/0                    scram-sha-256
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
