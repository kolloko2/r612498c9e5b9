[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "training-voice-gateway"
version = "0.1.0"
description = "Isolated Asterisk media gateway for training SIP calls"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "websockets>=15,<18", "pydantic-settings>=2.7,<3", "numpy>=2,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
local = ["vosk>=0.3.45,<0.4", "sherpa-onnx>=1.12,<2", "piper-tts>=1.3,<2"]
silero = ["torch>=2.1,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
