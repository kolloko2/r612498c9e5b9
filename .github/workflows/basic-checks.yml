name: Basic checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject tracked environment files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)[.]env($|[.])' | grep -vE '(^|/)[.]env[.]example$'; then exit 1; fi
      - name: Validate YAML
        run: |
          ruby -e "require 'yaml'; Dir['**/*.{yml,yaml}'].reject { |p| p.start_with?('.git/') }.each { |p| YAML.load_file(p, aliases: true) }; puts 'YAML OK'"
      - name: Install Python checks
        run: python -m pip install -e './voice[test]' -r backend/requirements.txt
      - name: Voice and dialogue tests
        run: |
          (cd voice && python -m pytest tests -q)
          (cd backend && python -m pytest -q)
          (cd frontend && python -m pytest -q)
      - name: Compile local services
        run: python -m compileall -q voice/app backend frontend/server.py tools/windows-training tools/run_workspace.py
      - name: Student JavaScript syntax
        run: |
          node --check frontend/assets/student.js
          node --check frontend/assets/instructor.js
          node --check frontend/assets/login.js
          node --check frontend/assets/portal.js
          node --check frontend/assets/scenarios.js
      - name: Frontend checks when configured
        run: if [ -f frontend/package.json ]; then cd frontend && npm install && npm run typecheck --if-present && npm run lint --if-present; fi
