<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><title>Тренажёр оператора 112</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#182c38;background:#edf2f5}*{box-sizing:border-box}body{margin:0}header{background:#142d3b;color:white;padding:22px 5vw;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:25px}header small{color:#afc4d0}main{max-width:1100px;margin:24px auto;padding:0 20px}.bar,.compose,.history{background:white;padding:18px;border-radius:14px;margin-bottom:14px}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select,input,textarea{font:inherit;border:1px solid #c2d2da;border-radius:8px;padding:11px 12px;background:white}button{cursor:pointer}button.primary{background:#007d79;color:white;border-color:#007d79}button.danger{color:#a52b38}button:disabled{opacity:.45;cursor:not-allowed}#chat{height:44vh;min-height:280px;overflow:auto;background:#f8fbfc;border:1px solid #d5e1e7;border-radius:14px;padding:20px}.bubble{max-width:80%;background:white;border:1px solid #d8e3e9;border-radius:12px;padding:12px 16px;margin:0 0 12px;white-space:pre-wrap}.bubble.me{margin-left:auto;background:#e1f3ef}.meta,.status,.hint{font-size:12px;color:#627a87}.status{margin-top:8px}.compose{margin-top:14px}textarea{width:100%;resize:vertical;min-height:90px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}#error,.form-error{color:#a02636;min-height:24px;white-space:pre-wrap}a{color:#007d79}#empty{color:#6e8390;text-align:center;padding:60px 10px}#connection{font-size:13px}label{font-size:14px}#callstate{margin-left:auto}.history{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#history{max-width:100%;flex:1}#ids{overflow-wrap:anywhere;font-size:11px;color:#6e8390;margin:10px 0}.scenario-line{display:flex;gap:8px;align-items:end;flex:1;min-width:320px}.scenario-line label{flex:1}.scenario-line select{width:100%;margin-top:5px}dialog{border:0;border-radius:16px;box-shadow:0 18px 60px #10293655;width:min(820px,94vw);max-height:92vh;padding:0}dialog::backdrop{background:#10293699}.modal-head{padding:18px 22px;background:#142d3b;color:white;display:flex;align-items:center;justify-content:space-between}.modal-head h2{margin:0;font-size:21px}.modal-body{padding:20px;max-height:calc(92vh - 64px);overflow:auto}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tools select{flex:1;min-width:230px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid label{display:flex;flex-direction:column;gap:5px}.grid .wide{grid-column:1/-1}.grid textarea{min-height:74px}.check{flex-direction:row!important;align-items:center}.check input{width:auto}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}.grid .wide{grid-column:auto}.scenario-line{min-width:100%}#callstate{margin-left:0}}
</style>
<header><div><h1>Тренажёр оператора 112</h1><small>Вы — оператор · бот — пострадавший</small></div><span id="connection">Проверка сервера…</span></header>
<main><div class="bar"><button id="call" class="primary">Позвонить на 201</button><button id="hangup" class="danger" disabled>Завершить звонок</button><label>Режим <select id="mode"><option value="manual">Ручной режим</option><option value="auto">Автоматический бот</option><option value="external">Внешний ИИ — пострадавший</option></select></label><div class="scenario-line"><label>Сценарий пострадавшего<select id="scenario"></select></label><button id="builder">Конструктор</button></div><strong id="callstate">Нет звонка</strong></div>
<div class="history"><label for="history">История</label><select id="history"><option value="">Новый звонок</option></select><a id="txt" hidden>Скачать TXT</a><a id="json" hidden>Скачать JSON</a></div>
<div id="error" role="alert"></div><div id="chat" aria-live="polite"><div id="empty">Выберите сценарий, позвоните на 201 и примите звонок в MicroSIP.</div></div><div id="ids"></div>
<div class="compose"><label for="text">Текст, который прозвучит в телефоне</label><textarea id="text" maxlength="4000" placeholder="Например: Помогите, в квартире пожар"></textarea><div class="row"><button id="say" class="primary" disabled>Озвучить в телефоне</button><button id="stop" disabled>Остановить озвучивание</button><span class="hint">Ctrl + Enter — озвучить</span></div><p class="hint" id="hint"></p></div></main>

<dialog id="scenarioDialog"><div class="modal-head"><h2>Конструктор сценариев</h2><button id="closeBuilder" aria-label="Закрыть">Закрыть</button></div><div class="modal-body"><div class="tools"><select id="manageScenario"></select><button id="newScenario">Новый</button><button id="copyScenario">Копировать</button><button id="deleteScenario" class="danger">Удалить</button></div><form id="scenarioForm"><div class="grid">
<label>Код сценария<input id="s_id" required pattern="[a-z0-9][a-z0-9_\-]{2,63}" maxlength="64" placeholder="fire_apartment"></label><label>Название<input id="s_title" required maxlength="120" placeholder="Пожар в квартире"></label>
<label>Имя пострадавшего<input id="s_victim_name" required maxlength="80" placeholder="Анна"></label><label>Состояние и эмоции<input id="s_emotion" required maxlength="200" placeholder="Испугана, говорит коротко"></label>
<label class="wide">Описание для списка<input id="s_description" maxlength="1000"></label><label class="wide">Что произошло<textarea id="s_incident" required maxlength="1000"></textarea></label><label class="wide">Где произошло<textarea id="s_location" required maxlength="500"></textarea></label>
<label>Известные факты, по одному в строке<textarea id="s_known_facts" required></textarea></label><label>Что пострадавший не знает<textarea id="s_unknown_facts"></textarea></label>
<label class="wide">Поведение пострадавшего<textarea id="s_behavior" maxlength="1000" placeholder="Отвечает только на вопросы, не придумывает факты"></textarea></label><label class="wide">Первая реплика<textarea id="s_opening" required maxlength="1000"></textarea></label>
<label class="check wide"><input id="s_enabled" type="checkbox" checked> Сценарий доступен для новых звонков</label></div><div class="form-error" id="scenarioError"></div><div class="form-actions"><button type="button" id="validateScenario">Проверить</button><button class="primary" type="submit">Сохранить</button></div></form></div></dialog>
<script>
const $=id=>document.getElementById(id);let cid=null,es=null,current=null,busy=false,serverReady=false,scenarios=[],creating=false;
const names={calling:'Вызов…',ringing:'Примите звонок',active:'Звонок активен',ended:'Звонок завершён',failed:'Ошибка звонка'};
const statuses={queued:'В очереди',recognizing:'Распознаётся',recognized:'Распознано',playing:'Озвучивается',played:'Озвучено',interrupted:'Прервано',error:'Ошибка'};
async function api(path,body,method){method=method||(body===undefined?'GET':'POST');const options={method,headers:{'X-Voice-UI':'1'}};if(body!==undefined){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body)}const r=await fetch('/api/'+path,options);if(r.status===204)return null;let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Не удалось выполнить действие');return d}
function controls(){const active=current?.status==='active',pending=['calling','ringing','active'].includes(current?.status);$('call').disabled=busy||pending||!serverReady||!$('scenario').value;$('hangup').disabled=busy||!pending;$('say').disabled=busy||!active||$('mode').value!=='manual';$('stop').disabled=busy||!active;$('history').disabled=!!pending;$('mode').disabled=busy||pending;$('scenario').disabled=busy||pending;$('builder').disabled=busy||pending;$('callstate').textContent=names[current?.status]||'Нет звонка';$('hint').textContent=$('mode').value==='manual'?'Ручной режим: бот молчит. Вы управляете репликами пострадавшего через поле ввода.':$('mode').value==='external'?'Внешний ИИ получает речь оператора и отправляет реплики пострадавшего через API. Говорите после окончания его реплики.':'Автоматический бот играет пострадавшего по выбранному сценарию. Говорите после окончания его реплики — звук во время ответа отсекается от эха.'}
async function run(fn){$('error').textContent='';busy=true;controls();try{await fn()}catch(e){$('error').textContent=e.message}finally{busy=false;controls()}}
function render(data){if(data.call_id!==cid)return;current=data;const option=Array.from($('history').options).find(o=>o.value===data.call_id);if(option)option.text=new Date(data.created_at).toLocaleString('ru-RU')+' — '+(names[data.status]||data.status);if(['calling','ringing','active'].includes(data.status)){$('mode').value=data.mode;if(data.scenario_id&&Array.from($('scenario').options).some(o=>o.value===data.scenario_id))$('scenario').value=data.scenario_id}const box=$('chat'),bottom=box.scrollHeight-box.scrollTop-box.clientHeight<100;box.replaceChildren();for(const m of data.messages){const b=document.createElement('div');b.className='bubble '+(m.role==='me'?'me':'');const meta=document.createElement('div');meta.className='meta';meta.textContent=({me:'Оператор (я)',operator:'Пострадавший (ввод текста)',bot:'Пострадавший (ИИ)'}[m.role])+' · '+new Date(m.time).toLocaleTimeString('ru-RU');const text=document.createElement('div');text.textContent=m.text||(m.status==='recognizing'?'Слушаю…':'Речь не распознана');const status=document.createElement('div');status.className='status';status.textContent=statuses[m.status]||m.status;b.append(meta,text,status);box.append(b)}if(!data.messages.length){const e=document.createElement('div');e.id='empty';e.textContent='Говорите в микрофон MicroSIP или введите текст для озвучивания.';box.append(e)}if(bottom)box.scrollTop=box.scrollHeight;$('ids').textContent='Сессия '+data.session_id+' · Звонок '+data.call_id;controls()}
function selectCall(id){cid=id;localStorage.setItem('voiceChatCall',id);if(es)es.close();es=new EventSource('/api/calls/'+id+'/events');es.onmessage=e=>render(JSON.parse(e.data));es.onerror=()=>{$('error').textContent='Связь с чатом прервалась. Переподключение…'};es.onopen=()=>{$('error').textContent=''};es.addEventListener('unavailable',()=>{$('error').textContent='Сервер звонков временно недоступен'});for(const f of ['txt','json']){$(f).hidden=false;$(f).href='/api/calls/'+id+'/export/'+f}}
async function history(){const list=await api('history');$('history').replaceChildren(new Option('Выберите звонок',''));for(const c of list)$('history').add(new Option(new Date(c.created_at).toLocaleString('ru-RU')+' — '+(names[c.status]||c.status),c.call_id));if(cid)$('history').value=cid;return list}
function scenarioBody(){return{id:$('s_id').value.trim(),title:$('s_title').value.trim(),description:$('s_description').value.trim(),victim_name:$('s_victim_name').value.trim(),incident:$('s_incident').value.trim(),location:$('s_location').value.trim(),known_facts:$('s_known_facts').value.split('\n').map(x=>x.trim()).filter(Boolean),unknown_facts:$('s_unknown_facts').value.split('\n').map(x=>x.trim()).filter(Boolean),emotion:$('s_emotion').value.trim(),behavior:$('s_behavior').value.trim(),opening:$('s_opening').value.trim(),enabled:$('s_enabled').checked}}
function fillScenario(s){for(const key of ['id','title','description','victim_name','incident','location','emotion','behavior','opening'])$('s_'+key).value=s?.[key]||'';$('s_known_facts').value=(s?.known_facts||[]).join('\n');$('s_unknown_facts').value=(s?.unknown_facts||[]).join('\n');$('s_enabled').checked=s?.enabled??true;$('s_id').disabled=!creating}
function chooseManaged(id){creating=false;const item=scenarios.find(s=>s.id===id)||scenarios[0];if(item){$('manageScenario').value=item.id;fillScenario(item)}$('deleteScenario').disabled=!item;$('copyScenario').disabled=!item}
async function loadScenarios(prefer){scenarios=await api('scenarios');const previous=prefer||$('scenario').value||localStorage.getItem('voiceScenario');$('scenario').replaceChildren();for(const s of scenarios.filter(x=>x.enabled))$('scenario').add(new Option(s.title,s.id));if(Array.from($('scenario').options).some(o=>o.value===previous))$('scenario').value=previous;if($('scenario').value)localStorage.setItem('voiceScenario',$('scenario').value);$('manageScenario').replaceChildren();for(const s of scenarios)$('manageScenario').add(new Option(s.title+(s.enabled?'':' — выключен'),s.id));chooseManaged(scenarios.find(s=>s.id===(prefer||previous))?.id||scenarios[0]?.id);controls()}
$('builder').onclick=()=>{$('scenarioError').textContent='';chooseManaged($('scenario').value);$('scenarioDialog').showModal()};$('closeBuilder').onclick=()=>$('scenarioDialog').close();$('manageScenario').onchange=()=>chooseManaged($('manageScenario').value);
$('newScenario').onclick=()=>{creating=true;fillScenario(null);$('s_id').disabled=false;$('deleteScenario').disabled=true;$('copyScenario').disabled=true;$('scenarioError').textContent=''};
$('copyScenario').onclick=()=>{const source=scenarios.find(s=>s.id===$('manageScenario').value);if(!source)return;creating=true;fillScenario({...source,id:(source.id+'_copy').slice(0,64),title:source.title+' — копия'});$('s_id').disabled=false;$('deleteScenario').disabled=true;$('scenarioError').textContent=''};
$('validateScenario').onclick=async()=>{try{if(!$('scenarioForm').reportValidity())return;await api('scenarios/validate',scenarioBody());$('scenarioError').style.color='#08755c';$('scenarioError').textContent='Сценарий заполнен правильно'}catch(e){$('scenarioError').style.color='';$('scenarioError').textContent=e.message}};
$('scenarioForm').onsubmit=async e=>{e.preventDefault();$('scenarioError').style.color='';try{const body=scenarioBody();await api('scenarios'+(creating?'':'/'+encodeURIComponent(body.id)),body,creating?'POST':'PUT');creating=false;await loadScenarios(body.id);$('scenario').value=body.enabled?body.id:$('scenario').value;localStorage.setItem('voiceScenario',$('scenario').value);$('scenarioError').style.color='#08755c';$('scenarioError').textContent='Сценарий сохранён'}catch(err){$('scenarioError').textContent=err.message}};
$('deleteScenario').onclick=async()=>{const item=scenarios.find(s=>s.id===$('manageScenario').value);if(!item||!confirm('Удалить сценарий «'+item.title+'»?'))return;try{await api('scenarios/'+encodeURIComponent(item.id),undefined,'DELETE');await loadScenarios();$('scenarioError').textContent=''}catch(e){$('scenarioError').textContent=e.message}};
$('scenario').onchange=()=>localStorage.setItem('voiceScenario',$('scenario').value);
$('call').onclick=()=>run(async()=>{const c=await api('calls',{session_id:crypto.randomUUID(),mode:$('mode').value,scenario_id:$('scenario').value});current=c;selectCall(c.call_id);await history()});$('hangup').onclick=()=>run(async()=>{await api('calls/'+cid+'/hangup',{});await history()});$('say').onclick=()=>run(async()=>{const text=$('text').value;if(!text.trim())throw Error('Введите текст для озвучивания');await api('calls/'+cid+'/say',{text,message_id:crypto.randomUUID()});$('text').value=''});$('stop').onclick=()=>run(()=>api('calls/'+cid+'/stop',{}));$('mode').onchange=controls;$('history').onchange=()=>{if($('history').value)selectCall($('history').value)};$('text').onkeydown=e=>{if(e.ctrlKey&&e.key==='Enter'&&!$('say').disabled)$('say').click()};
async function health(){try{await api('health');serverReady=true;$('connection').textContent='● Сервер подключён'}catch{serverReady=false;$('connection').textContent='● Сервер недоступен'}controls()}
(async()=>{$('mode').value='manual';await health();try{await loadScenarios();const list=await history();const selected=list.find(x=>['calling','ringing','active'].includes(x.status))||list.find(x=>x.call_id===localStorage.getItem('voiceChatCall'));if(selected){selectCall(selected.call_id);$('history').value=selected.call_id}}catch(e){$('error').textContent=e.message}})();setInterval(health,5000);
</script></html>
