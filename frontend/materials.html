<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Учебные материалы · Тренажёр 112</title><link rel="stylesheet" href="/assets/portal.css"><link rel="stylesheet" href="/assets/materials.css"><script src="/assets/materials.js" defer></script></head>
<body><header><div><strong>СИСТЕМА-112</strong><span id="pageKind">Учебные материалы</span></div><nav><a class="button" href="/portal">В кабинет</a> <a class="button" href="/">Рабочее место и помощь</a> <a id="scenarioLink" class="button" href="/scenarios" hidden>Сценарии</a></nav></header><main>
<div class="heading"><div><h1 id="title">Справочная библиотека</h1><p id="intro">Материалы ваших учебных групп.</p></div><button id="newMaterial" type="button" hidden>Новый материал</button></div>
<p id="status" role="status" aria-live="polite"></p>
<section class="panel filters"><label>Поиск<input id="search" type="search" placeholder="Название, описание или имя файла"></label><label>Сложность<select id="filterDifficulty"><option value="">Все</option></select></label><label>Профиль ДДС<select id="filterProfile"><option value="">Все</option></select></label></section>
<div class="materials-layout"><section><div id="materials" class="cards"></div></section><section id="reader" class="panel reader" hidden><div class="reader-head"><div><h2 id="readerTitle"></h2><p id="readerMeta"></p></div><button id="closeReader" type="button" aria-label="Закрыть">×</button></div><p id="readerDescription"></p><pre id="readerBody"></pre><button id="download" type="button" hidden>Скачать вложение</button></section></div>
<dialog id="editorDialog"><div class="dialog-head"><h2 id="editorTitle">Новый материал</h2><button id="closeEditor" type="button" aria-label="Закрыть">×</button></div><form id="materialForm" class="stack"><label>Название<input id="materialTitle" required minlength="3" maxlength="160"></label><label>Описание<textarea id="description" maxlength="2000"></textarea></label><div class="columns"><label>Сложность<select id="difficulty" required></select></label><label>Профиль ДДС<select id="profile" required></select></label></div><label>Учебный текст<textarea id="body" maxlength="100000" rows="10" placeholder="Текст отображается без HTML-форматирования"></textarea></label><label>Вложение PDF, TXT или DOCX до 5 МиБ<input id="file" type="file" accept=".pdf,.txt,.docx,application/pdf,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label><p id="existingFile" class="file-note"></p><label>Учебные группы<select id="materialGroups" multiple size="5"></select></label><label class="check"><input id="published" type="checkbox"> Опубликовать для студентов выбранных групп</label><p class="file-note">Черновик можно сохранить без групп. Для публикации выберите хотя бы одну.</p><button class="primary" type="submit">Сохранить</button></form></dialog>
</main></body></html>
