<!doctype html>
<html lang="ru">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
 <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
 <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
 <title>Вход · Тренажёр диспетчера ДДС</title>
 <link rel="stylesheet" href="/assets/instructor.css">
 <link rel="stylesheet" href="/assets/cabinet.css">
 <link rel="stylesheet" href="/assets/login.css">
 <script src="/assets/login.js" defer></script>
</head>
<body class="login-city">
 <main>
  <section class="login-panel" aria-labelledby="heading">
   <h1 class="login-title"><span class="big112" aria-hidden="true">112</span> <span id="heading">Вход в систему</span></h1>
   <p class="login-intro">Тренажёр диспетчера ДДС</p>
   <form id="loginForm"><fieldset id="controls" disabled>
    <label>Логин<input name="username" required minlength="3" maxlength="40" pattern="[a-zA-Z0-9_.\-]+" autocomplete="username"></label>
    <label>Пароль<input name="password" type="password" required maxlength="128" autocomplete="current-password"></label>
    <label id="workstationLabel">Номер АРМ<input name="workstation" maxlength="80" autocomplete="off" placeholder="Например, АРМ-1"></label>
    <button type="submit">Войти</button>
   </fieldset></form>
   <form id="mfaForm" hidden><fieldset id="mfaControls">
    <p>Введите код из приложения-аутентификатора или резервный код.</p>
    <label>Код подтверждения<input name="code" required minlength="6" maxlength="20" inputmode="numeric" autocomplete="one-time-code" placeholder="123 456"></label>
    <button type="submit">Войти</button> <button type="button" id="mfaBack">Назад</button>
   </fieldset></form>
   <p id="status" role="alert"></p>
  </section>
  <section id="demoAccess" class="demo-panel" aria-labelledby="demoHeading" hidden>
   <h2 id="demoHeading">Учётные записи для проверки</h2>
   <p>Нажмите «Выбрать» — логин и пароль подставятся в форму, затем «Войти».</p>
   <div id="demoAccounts" class="demo-accounts"></div>
  </section>
 </main>
</body>
</html>
