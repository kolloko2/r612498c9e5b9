      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
    delete:
      summary: Delete Scenario
      operationId: delete_scenario_api_v1_scenarios__scenario_id__delete
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
          type: string
          title: Scenario Id
      - name: X-User-Session
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-User-Session
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /calls:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCall'
      responses:
        '201':
          description: Call created
        '429':
          description: Active call capacity reached or training extension already
            busy
  /calls/{call_id}:
    parameters:
    - $ref: '#/components/parameters/CallId'
    get:
      responses:
        '200':
          description: Call snapshot
  /calls/{call_id}/hangup:
    parameters:
    - $ref: '#/components/parameters/CallId'
    post:
      responses:
        '200':
          description: Call ended
  /chat:
    get:
      responses:
        '200':
          description: Persistent call chats
  /chat/{call_id}:
    parameters:
    - $ref: '#/components/parameters/CallId'
    get:
      responses:
        '200':
          description: Chat and playback states
  /chat/{call_id}/say:
    parameters:
    - $ref: '#/components/parameters/CallId'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Speak'
      responses:
        '200':
          description: Exact text queued for playback
  /chat/{call_id}/stop:
    parameters:
    - $ref: '#/components/parameters/CallId'
    post:
      responses:
        '200':
          description: Playback stopped
  /integration/calls:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalCall'
      responses:
        '201':
          description: External-AI call created
  /integration/calls/{call_id}:
    parameters:
