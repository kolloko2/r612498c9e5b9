      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CallId:
      name: call_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreateCall:
      type: object
      required:
      - session_id
      properties:
        session_id:
          type: string
          format: uuid
        extension:
          type: string
          default: '201'
        mode:
          type: string
          enum:
          - manual
          - auto
          - external
          default: auto
        scenario_id:
          type: string
          nullable: true
    ExternalCall:
      type: object
      required:
      - session_id
      properties:
        session_id:
          type: string
          format: uuid
        extension:
          type: string
          default: '201'
    Speak:
      type: object
      required:
      - message_id
      - text
      properties:
        message_id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 4000
        interrupt:
          type: boolean
          default: false
    Scenario:
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{2,63}$
          title: Id
        title:
          type: string
          maxLength: 120
          minLength: 3
          title: Title
        category_id:
          type: string
          enum:
          - fire
          - traffic
          - medical
          - utilities
          - public
          - other
          title: Category Id
          default: other
        difficulty:
          type: string
          enum:
          - basic
          - standard
          - advanced
          title: Difficulty
          default: basic
        dds_profile:
          type: string
          enum:
          - general
          - fire
          - police
          - medical
          - gas
          - utilities
          title: Dds Profile
          default: general
        learning_objectives:
          type: string
          maxLength: 1500
          title: Learning Objectives
          default: ''
        description:
          type: string
          maxLength: 1000
          title: Description
          default: ''
        victim_name:
          type: string
          maxLength: 80
          minLength: 1
          title: Victim Name
        incident:
          type: string
          maxLength: 1000
          minLength: 3
          title: Incident
        location:
          type: string
          maxLength: 500
          minLength: 3
          title: Location
        known_facts:
          items:
            type: string
          type: array
          maxItems: 30
          minItems: 1
          title: Known Facts
        unknown_facts:
          items:
            type: string
          type: array
          maxItems: 20
          title: Unknown Facts
        emotion:
          type: string
          maxLength: 200
          minLength: 2
          title: Emotion
        behavior:
          type: string
          maxLength: 1000
          title: Behavior
          default: ''
        opening:
          type: string
          maxLength: 1000
          minLength: 3
          title: Opening
        updates:
          items:
            $ref: '#/components/schemas/SituationUpdate'
          type: array
          maxItems: 6
          title: Updates
        owner_service:
          type: string
          maxLength: 160
          title: Owner Service
          default: ''
        dds_expectation:
          anyOf:
          - $ref: '#/components/schemas/DdsExpectation'
          - type: 'null'
        enabled:
          type: boolean
          title: Enabled
          default: true
      additionalProperties: false
      type: object
      required:
      - id
      - title
      - victim_name
      - incident
      - location
      - known_facts
      - emotion
      - opening
      title: Scenario
    Card:
      properties:
        caller_name:
          type: string
          maxLength: 160
          title: Caller Name
          default: ''
        caller_status:
          type: string
          maxLength: 80
          title: Caller Status
          default: ''
        phone:
          type: string
          maxLength: 40
          title: Phone
          default: ''
        supplied_phone:
          type: string
          maxLength: 40
          title: Supplied Phone
          default: ''
        scene_phone:
          type: string
          maxLength: 40
          title: Scene Phone
          default: ''
        country:
          type: string
          maxLength: 100
          title: Country
          default: Россия
        region:
          type: string
          maxLength: 100
          title: Region
          default: Москва
        city:
          type: string
          maxLength: 100
          title: City
          default: Москва
        district:
          type: string
          maxLength: 100
          title: District
          default: ''
        area:
          type: string
          maxLength: 100
          title: Area
          default: ''
        object:
          type: string
          maxLength: 200
          title: Object
          default: ''
        street:
          type: string
          maxLength: 200
          title: Street
          default: ''
