    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Speak'
      responses:
        '202':
          description: Victim reply accepted idempotently
  /integration/calls/{call_id}/events:
    parameters:
    - $ref: '#/components/parameters/CallId'
    - name: after
      in: query
      schema:
        type: integer
        minimum: 0
    - name: follow
      in: query
      schema:
        type: boolean
        default: true
    get:
      responses:
        '200':
          description: SSE stream or JSON when follow=false
  /integration/calls/{call_id}/stop:
    parameters:
    - $ref: '#/components/parameters/CallId'
    post:
      responses:
        '200':
          description: External playback stopped
  /integration/calls/{call_id}/hangup:
