      - kind
      title: UnproductiveCall
      description: 'Нерезультативный вызов: нет контакта с заявителем или срыв звонка.


        Инструкция оператора описывает это как отдельный быстрый путь: карточка

        сохраняется пустой, сразу уходит в завершённый статус и помечается

        проверенной — оператор не заполняет её и освобождает линию. Проверка здесь

        техническая (оператор подтвердил, что заполнять нечего), а не методическая

        оценка преподавателя.'
    VisService:
      properties:
        message_id:
          type: string
          format: uuid
          title: Message Id
        service:
          type: string
          maxLength: 160
          minLength: 1
          title: Service
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - message_id
      - service
      - reason
      title: VisService
      description: 'Служба, добавленная в карточку внешней информационной системой.


        Инструкция оператора: «В карточку, созданную оператором Службы 112, из

        внешней системы по решению оператора службы могут быть добавлены

        дополнительные службы для реагирования. В этом случае добавленная служба

        будет отображаться с пометкой ВИС». В тренажёре сторону службы играет

        преподаватель: реальная интеграция отсутствует, и доставка ничего не

        отправляет за пределы стенда.'
    SituationUpdate:
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,31}$
          title: Id
        after_seconds:
          type: integer
          maximum: 3600.0
          minimum: 5.0
          title: After Seconds
        text:
          type: string
          maxLength: 600
          minLength: 3
          title: Text
        source:
          type: string
          maxLength: 120
          minLength: 1
          title: Source
          default: Служба 112
        unlocks_status:
          type: string
          maxLength: 60
          title: Unlocks Status
          default: ''
      additionalProperties: false
      type: object
      required:
      - id
      - after_seconds
      - text
      title: SituationUpdate
      description: 'Вводная: новое обстоятельство, приходящее по ходу работы с карточкой.


        Заказчик просил моделировать полный жизненный цикл происшествия, а не

        заполнение формы. Настоящая работа диспетчера состоит в том, что обстановка

        меняется: бригада не проехала, появился второй пострадавший, заявитель

        перезвонил. Вводная приходит через заданное время после выдачи карточки и

        требует от диспетчера пересмотреть решение.


        Срабатывание детерминированное — по секундомеру карточки, а не по решению

        модели: одна и та же карточка обязана вести себя одинаково у всех

        обучающихся группы.'
    DdsExpectation:
      properties:
        should_accept:
          type: boolean
          title: Should Accept
          default: true
        refusal_kind:
          type: string
          enum:
          - ''
          - foreign_territory
          - duplicate
          - no_works
          title: Refusal Kind
          default: ''
        refusal_keywords:
          items:
            type: string
          type: array
          maxItems: 6
          title: Refusal Keywords
        brief_service:
          type: string
          maxLength: 160
          title: Brief Service
          default: ''
        update_response_limit_seconds:
          type: integer
          maximum: 1800.0
          minimum: 5.0
          title: Update Response Limit Seconds
          default: 90
      additionalProperties: false
      type: object
      title: DdsExpectation
      description: 'Чего ждут от диспетчера ДДС по этой карточке.


        Эталон по полям проверяет заполненность, а в основном режиме поля приходят

        уже заполненными Службой 112. Оценивать надо решения: принял ли профильную

        карточку, правильно ли отказался от чужой, вовремя ли отразил доклад с

        места, доложил ли дежурному и записал ли результат перед закрытием работ.

        Все проверки выводятся из журнала событий карточки и воспроизводимы.'
