openapi: 3.1.0
info:
  title: 112 AI Trainer REST API
  version: 0.3.0
  description: Backend scenario API and Voice Gateway API on separate ports.
servers:
- url: http://127.0.0.1:8000/api/v1
  description: Scenario backend
- url: http://127.0.0.1:8001/api/v1
  description: Voice Gateway
security:
- bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        '200':
          description: Service health. Backend adds cluster coordination/instance
            metadata; Voice adds speech provider availability, topology_verified,
            durable-ack reconnect budget and security_audit retention/status. No credentials
            are returned.
  /scenarios:
    get:
      summary: List Scenarios
      operationId: list_scenarios_api_v1_scenarios_get
      parameters:
      - name: X-User-Session
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-User-Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScenarioView'
                title: Response List Scenarios Api V1 Scenarios Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
    post:
      summary: Create Scenario
      operationId: create_scenario_api_v1_scenarios_post
      parameters:
      - name: X-User-Session
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-User-Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /scenarios/validate:
    post:
      summary: Validate Scenario
      operationId: validate_scenario_api_v1_scenarios_validate_post
      parameters:
      - name: X-User-Session
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-User-Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
