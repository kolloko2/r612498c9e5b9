          default: ''
          title: X-User-Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
    put:
      summary: Update Scenario
      operationId: update_scenario_api_v1_scenarios__scenario_id__put
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
